<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爆線陀螺X - 立體物理模擬</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
  }
  #canvas-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #ui {
    position: fixed;
    top: 16px; left: 16px;
    z-index: 10;
    background: rgba(10, 10, 20, 0.82);
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    padding: 16px 20px;
    min-width: 260px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #ui h1 {
    font-size: 18px;
    letter-spacing: 2px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, #ff6b35, #ffd23f, #3ec1d3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #ui .sub {
    font-size: 11px;
    color: #666;
    margin-bottom: 14px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .row label { font-size: 13px; color: #aaa; white-space: nowrap; }
  button {
    background: #1a1a2e;
    border: 1px solid #3a3a5a;
    color: #ccc;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
    flex: 1;
  }
  button:hover { background: #2a2a4a; border-color: #5a5a8a; }
  button.active {
    background: linear-gradient(135deg, #ff6b35, #cc4422);
    border-color: #ff6b35;
    color: #fff;
    box-shadow: 0 0 12px rgba(255,107,53,0.4);
  }
  input[type=range] {
    flex: 1;
    accent-color: #ff6b35;
    height: 4px;
  }
  .val {
    font-size: 12px;
    color: #ffd23f;
    min-width: 36px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  #power-display {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    color: #ffd23f;
    margin: 6px 0 2px;
    text-shadow: 0 0 20px rgba(255,210,63,0.3);
  }
  #power-display small { font-size: 12px; color: #888; font-weight: 400; }
  #launch-btn {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #ff6b35, #ffd23f);
    border: none;
    color: #111;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.1s, box-shadow 0.15s;
  }
  #launch-btn:hover { box-shadow: 0 0 24px rgba(255,107,53,0.6); }
  #launch-btn:active { transform: scale(0.97); }
  #launch-btn:disabled {
    background: #2a2a3a;
    color: #555;
    cursor: not-allowed;
    box-shadow: none;
  }
  #hud {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
    z-index: 10;
    background: rgba(10,10,20,0.75);
    padding: 10px 24px;
    border-radius: 30px;
    border: 1px solid #2a2a4a;
    backdrop-filter: blur(6px);
  }
  .spin-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #333;
  }
  .dot.p1 { background: #3ec1d3; box-shadow: 0 0 10px #3ec1d3; }
  .dot.p2 { background: #ff4d6d; box-shadow: 0 0 10px #ff4d6d; }
  .spin-bar {
    width: 100px; height: 6px;
    background: #1a1a2e;
    border-radius: 3px;
    overflow: hidden;
  }
  .spin-bar div {
    height: 100%;
    transition: width 0.1s linear;
    border-radius: 3px;
  }
  .p1bar div { background: linear-gradient(90deg, #3ec1d3, #2a8a99); }
  .p2bar div { background: linear-gradient(90deg, #ff4d6d, #aa2233); }
  #result {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 6px;
    z-index: 20;
    pointer-events: none;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-shadow: 0 0 40px currentColor;
  }
  #result.show { transform: translate(-50%, -50%) scale(1); }
  #hint {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #555;
    z-index: 10;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div id="ui">
  <h1>爆線陀螺X</h1>
  <div class="sub">3D 物理模擬 · 可調拉力</div>

  <div class="row">
    <label>模式</label>
    <button id="mode-1p" class="active">單人</button>
    <button id="mode-2p">雙人</button>
  </div>

  <div id="p2-controls" style="display:none;">
    <div class="row">
      <label>P2 型號</label>
      <button id="p2-type-attack" class="active">攻擊</button>
      <button id="p2-type-stamina">持久</button>
    </div>
  </div>

  <div id="power-display">50<small>%</small></div>
  <div class="row">
    <label>拉的力度</label>
    <input type="range" id="power" min="10" max="100" value="50">
    <span class="val" id="power-val">50%</span>
  </div>

  <button id="launch-btn">發 射 ！</button>
</div>

<div id="hud">
  <div class="spin-indicator">
    <div class="dot p1" id="dot1"></div>
    <span>P1</span>
    <div class="spin-bar p1bar"><div id="bar1" style="width:100%"></div></div>
  </div>
  <div class="spin-indicator" id="p2-hud" style="display:none;">
    <div class="dot p2" id="dot2"></div>
    <span>P2</span>
    <div class="spin-bar p2bar"><div id="bar2" style="width:100%"></div></div>
  </div>
</div>

<div id="hint">拖動滑桿調力度 · 點「發射」開始 · 雙人模式雙方輪流發射</div>
<div id="result"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============ 場景 ============
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.FogExp2(0x0a0a12, 0.035);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 7, 9);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// 燈光
scene.add(new THREE.AmbientLight(0x404060, 1.2));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
keyLight.position.set(5, 12, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -10;
keyLight.shadow.camera.right = 10;
keyLight.shadow.camera.top = 10;
keyLight.shadow.camera.bottom = -10;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x3ec1d3, 1.5);
rimLight.position.set(-6, 6, -6);
scene.add(rimLight);

// 地面
const groundGeo = new THREE.CircleGeometry(30, 64);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x12121e, roughness: 0.9, metalness: 0.1
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// 戰鬥盤
const stadiumRadius = 4.2;
const stadiumWallH = 0.45;
const stadiumGroup = new THREE.Group();

const floorGeo = new THREE.CylinderGeometry(stadiumRadius, stadiumRadius, 0.15, 64);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x1a1a30, roughness: 0.6, metalness: 0.3
});
const stadiumFloor = new THREE.Mesh(floorGeo, floorMat);
stadiumFloor.position.y = 0.075;
stadiumFloor.receiveShadow = true;
stadiumGroup.add(stadiumFloor);

const wallGeo = new THREE.CylinderGeometry(stadiumRadius + 0.08, stadiumRadius + 0.08, stadiumWallH, 64, 1, true);
const wallMat = new THREE.MeshStandardMaterial({
  color: 0x2a2a50, roughness: 0.4, metalness: 0.6,
  side: THREE.DoubleSide, transparent: true, opacity: 0.85
});
const wall = new THREE.Mesh(wallGeo, wallMat);
wall.position.y = stadiumWallH/2 + 0.15;
stadiumGroup.add(wall);

// 盤面紋路
const ringGeo = new THREE.RingGeometry(stadiumRadius*0.55, stadiumRadius*0.58, 64);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x3ec1d3, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = -Math.PI/2;
ring.position.y = 0.155;
stadiumGroup.add(ring);

scene.add(stadiumGroup);

// ============ 陀螺建模 ============
function createBeyblade(colorA, colorB, type) {
  const group = new THREE.Group();

  // 底部旋轉軸
  const tipGeo = new THREE.ConeGeometry(0.12, 0.3, 16);
  const tipMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.2 });
  const tip = new THREE.Mesh(tipGeo, tipMat);
  tip.rotation.x = Math.PI;
  tip.position.y = 0.15;
  tip.castShadow = true;
  group.add(tip);

  // 主體圓環
  const bodyGeo = new THREE.CylinderGeometry(0.55, 0.5, 0.18, 24);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: colorA, metalness: 0.7, roughness: 0.3
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.39;
  body.castShadow = true;
  group.add(body);

  // 外圈
  const ringGeo2 = new THREE.TorusGeometry(0.52, 0.1, 12, 32);
  const ringMat2 = new THREE.MeshStandardMaterial({
    color: colorB, metalness: 0.8, roughness: 0.25
  });
  const outerRing = new THREE.Mesh(ringGeo2, ringMat2);
  outerRing.rotation.x = Math.PI/2;
  outerRing.position.y = 0.39;
  outerRing.castShadow = true;
  group.add(outerRing);

  // 頂蓋
  const capGeo = new THREE.CylinderGeometry(0.32, 0.42, 0.15, 20);
  const capMat = new THREE.MeshStandardMaterial({
    color: colorB, metalness: 0.6, roughness: 0.35
  });
  const cap = new THREE.Mesh(capGeo, capMat);
  cap.position.y = 0.555;
  cap.castShadow = true;
  group.add(cap);

  // 裝飾刃片（依型號不同）
  const bladeCount = type === 'attack' ? 6 : 4;
  const bladeGeo = new THREE.BoxGeometry(0.5, 0.06, 0.12);
  const bladeMat = new THREE.MeshStandardMaterial({
    color: 0xdddddd, metalness: 0.95, roughness: 0.15
  });
  for (let i = 0; i < bladeCount; i++) {
    const blade = new THREE.Mesh(bladeGeo, bladeMat);
    const angle = (i / bladeCount) * Math.PI * 2;
    blade.position.set(Math.cos(angle)*0.62, 0.39, Math.sin(angle)*0.62);
    blade.rotation.y = -angle;
    blade.rotation.z = type === 'attack' ? 0.25 : 0;
    blade.castShadow = true;
    group.add(blade);
  }

  // 型號光環
  const glowGeo = new THREE.TorusGeometry(0.75, 0.02, 8, 40);
  const glowMat = new THREE.MeshBasicMaterial({
    color: colorA, transparent: true, opacity: 0.6
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.rotation.x = Math.PI/2;
  glow.position.y = 0.39;
  group.add(glow);

  return group;
}

// ============ 物理參數 ============
class Spinner {
  constructor(mesh, color, type, isPlayer2) {
    this.mesh = mesh;
    this.color = color;
    this.type = type;
    this.isPlayer2 = isPlayer2;

    // 位置與速度
    this.pos = new THREE.Vector2(0, 0);
    this.vel = new THREE.Vector2(0, 0);
    this.radius = 0.55;

    // 旋轉
    this.spinSpeed = 0;        // 當前轉速 (rad/s 視覺用)
    this.spinEnergy = 0;       // 能量條 0~1
    this.angle = 0;
    this.wobblePhase = Math.random() * Math.PI * 2;
    this.wobbleAmp = 0;

    // 狀態
    this.alive = false;
    this.tilt = 0;
    this.vy = 0;
    this.y = 0.15;
    this.grounded = false;
  }

  launch(power, angleDeg) {
    // power: 0~1
    this.alive = true;
    this.spinEnergy = 0.35 + power * 0.65;
    this.spinSpeed = 8 + power * 40;

    // 發射速度方向
    const rad = angleDeg * Math.PI / 180;
    const launchSpeed = 1.5 + power * 5.5;
    this.vel.set(Math.cos(rad) * launchSpeed, Math.sin(rad) * launchSpeed);

    this.pos.set(0, 0);
    this.y = 0.15;
    this.vy = 2 + power * 3;
    this.grounded = false;
    this.wobbleAmp = 0.15 + (1 - power) * 0.3;
    this.tilt = 0;
    this.angle = Math.random() * Math.PI * 2;
  }

  update(dt) {
    if (!this.alive) return;

    // 重力與落地
    if (!this.grounded) {
      this.vy -= 14 * dt;
      this.y += this.vy * dt;
      if (this.y <= 0.15) {
        this.y = 0.15;
        this.vy = 0;
        this.grounded = true;
      }
    }

    // 摩擦力（落地後減速）
    if (this.grounded) {
      const friction = this.type === 'stamina' ? 1.8 : 2.4;
      const speed = this.vel.length();
      if (speed > 0.01) {
        const decel = Math.min(friction * dt, speed);
        this.vel.multiplyScalar((speed - decel) / speed);
      } else {
        this.vel.set(0, 0);
      }
    }

    // 位置更新
    this.pos.x += this.vel.x * dt;
    this.pos.y += this.vel.y * dt;

    // 邊界碰撞（戰鬥盤圍牆）
    const dist = this.pos.length();
    const maxDist = stadiumRadius - this.radius - 0.15;
    if (dist > maxDist) {
      const nx = this.pos.x / dist;
      const ny = this.pos.y / dist;
      this.pos.set(nx * maxDist, ny * maxDist);
      // 反彈
      const dot = this.vel.x * nx + this.vel.y * ny;
      this.vel.x -= 2 * dot * nx * 0.65;
      this.vel.y -= 2 * dot * ny * 0.65;
      this.spinEnergy -= 0.01;
    }

    // 旋轉能量衰減
    const decayRate = this.type === 'stamina' ? 0.028 : 0.055;
    this.spinEnergy -= decayRate * dt * (1 + this.vel.length() * 0.12);
    if (this.spinEnergy <= 0) {
      this.spinEnergy = 0;
      this.alive = false;
      return;
    }

    // 視覺旋轉
    this.angle += this.spinSpeed * dt * (0.5 + this.spinEnergy * 0.5);

    // 搖晃
    this.wobblePhase += dt * (3 + this.vel.length() * 2);
    const wobble = Math.sin(this.wobblePhase) * this.wobbleAmp * (1 - this.spinEnergy * 0.7);
    this.tilt = wobble;

    // 同步到 mesh
    this.mesh.position.set(this.pos.x, this.y, this.pos.y);
    this.mesh.rotation.y = this.angle;
    this.mesh.rotation.z = wobble;
    this.mesh.rotation.x = Math.cos(this.wobblePhase * 1.3) * this.wobbleAmp * 0.5 * (1 - this.spinEnergy);

    // 光環透明度
    const glow = this.mesh.children[this.mesh.children.length - 1];
    if (glow) glow.material.opacity = 0.3 + this.spinEnergy * 0.5;
  }
}

// 碰撞處理（兩個陀螺）
function resolveCollision(a, b) {
  if (!a.alive || !b.alive) return;

  const dx = b.pos.x - a.pos.x;
  const dy = b.pos.y - a.pos.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const minDist = a.radius + b.radius;

  if (dist < minDist && dist > 0.001) {
    const nx = dx / dist;
    const ny = dy / dist;
    const overlap = minDist - dist;

    // 分離
    a.pos.x -= nx * overlap * 0.5;
    a.pos.y -= ny * overlap * 0.5;
    b.pos.x += nx * overlap * 0.5;
    b.pos.y += ny * overlap * 0.5;

    // 相對速度
    const rvx = b.vel.x - a.vel.x;
    const rvy = b.vel.y - a.vel.y;
    const velAlongNormal = rvx * nx + rvy * ny;

    if (velAlongNormal < 0) {
      // 攻擊型 vs 其他：攻擊型碰撞時有額外加乘
      const restitution = 0.85;
      const j = -(1 + restitution) * velAlongNormal / 2;

      a.vel.x -= nx * j;
      a.vel.y -= ny * j;
      b.vel.x += nx * j;
      b.vel.y += ny * j;

      // 撞擊能量損失與攻擊加成
      const impactStrength = Math.abs(velAlongNormal);
      let aDmg = impactStrength * 0.02;
      let bDmg = impactStrength * 0.02;

      if (a.type === 'attack') bDmg *= 1.6;
      if (b.type === 'attack') aDmg *= 1.6;

      a.spinEnergy -= aDmg;
      b.spinEnergy -= bDmg;

      // 撞擊時降低搖晃，增加穩定
      a.wobbleAmp = Math.max(0.05, a.wobbleAmp * 0.9);
      b.wobbleAmp = Math.max(0.05, b.wobbleAmp * 0.9);

      // 火花效果（簡易：短暫放大光環）
      const glowA = a.mesh.children[a.mesh.children.length - 1];
      const glowB = b.mesh.children[b.mesh.children.length - 1];
      if (glowA) glowA.material.opacity = 1;
      if (glowB) glowB.material.opacity = 1;
    }
  }
}

// ============ 遊戲狀態 ============
let mode = 1; // 1 或 2
let currentPlayer = 1;
let p1Type = 'attack';
let p2Type = 'attack';
let launchedCount = 0;
let gameActive = false;

// 陀螺實例
let p1, p2;

function resetGame() {
  if (p1) scene.remove(p1.mesh);
  if (p2) scene.remove(p2.mesh);

  const mesh1 = createBeyblade(0x3ec1d3, 0x1a6b7a, p1Type);
  mesh1.scale.set(0.8, 0.8, 0.8);
  scene.add(mesh1);
  p1 = new Spinner(mesh1, 0x3ec1d3, p1Type, false);

  if (mode === 2) {
    const mesh2 = createBeyblade(0xff4d6d, 0xaa2233, p2Type);
    mesh2.scale.set(0.8, 0.8, 0.8);
    scene.add(mesh2);
    p2 = new Spinner(mesh2, 0xff4d6d, p2Type, true);
  } else {
    p2 = null;
  }

  launchedCount = 0;
  gameActive = false;
  currentPlayer = 1;
  document.getElementById('result').classList.remove('show');
  document.getElementById('bar1').style.width = '100%';
  if (mode === 2) document.getElementById('bar2').style.width = '100%';
  updateUI();
}

function updateUI() {
  const launchBtn = document.getElementById('launch-btn');

  if (mode === 1) {
    launchBtn.disabled = launchedCount >= 1;
    launchBtn.textContent = launchedCount >= 1 ? '已發射' : '發 射 ！';
  } else {
    if (launchedCount >= 2) {
      launchBtn.disabled = true;
      launchBtn.textContent = '對戰中';
    } else {
      launchBtn.disabled = false;
      launchBtn.textContent = currentPlayer === 1 ? 'P1 發射！' : 'P2 發射！';
    }
  }

  document.getElementById('p2-hud').style.display = mode === 2 ? 'flex' : 'none';
  document.getElementById('p2-controls').style.display = mode === 2 ? 'block' : 'none';
}

// ============ 渲染迴圈 ============
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (p1) p1.update(dt);
  if (p2) p2.update(dt);

  if (p2) resolveCollision(p1, p2);
  if (mode === 2 && p1 && p2) resolveCollision(p2, p1);

  // 更新能量條
  if (p1) document.getElementById('bar1').style.width = (p1.spinEnergy * 100) + '%';
  if (p2) document.getElementById('bar2').style.width = (p2.spinEnergy * 100) + '%';

  // 判定勝負
  if (gameActive) {
    if (mode === 1) {
      if (p1 && !p1.alive) {
        showResult('停 止', '#888');
        gameActive = false;
        setTimeout(() => { if (mode === 1) resetGame(); }, 1500);
      }
    } else {
      const p1Dead = !p1.alive;
      const p2Dead = !p2.alive;
      if (p1Dead && p2Dead) {
        showResult('平 手', '#ffd23f');
        gameActive = false;
        setTimeout(resetGame, 1800);
      } else if (p1Dead) {
        showResult('P2 勝 利', '#ff4d6d');
        gameActive = false;
        setTimeout(resetGame, 1800);
      } else if (p2Dead) {
        showResult('P1 勝 利', '#3ec1d3');
        gameActive = false;
        setTimeout(resetGame, 1800);
      }
    }
  }

  // 相機輕微環繞
  const t = clock.getElapsedTime() * 0.1;
  camera.position.x = Math.sin(t) * 1.5;
  camera.position.z = 9 + Math.cos(t) * 0.5;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}

function showResult(text, color) {
  const el = document.getElementById('result');
  el.textContent = text;
  el.style.color = color;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1400);
}

// ============ UI 事件 ============
const powerSlider = document.getElementById('power');
const powerVal = document.getElementById('power-val');
const powerDisplay = document.getElementById('power-display');

powerSlider.addEventListener('input', () => {
  const v = powerSlider.value;
  powerVal.textContent = v + '%';
  powerDisplay.innerHTML = v + '<small>%</small>';
});

document.getElementById('mode-1p').addEventListener('click', () => {
  mode = 1;
  document.getElementById('mode-1p').classList.add('active');
  document.getElementById('mode-2p').classList.remove('active');
  resetGame();
});

document.getElementById('mode-2p').addEventListener('click', () => {
  mode = 2;
  document.getElementById('mode-2p').classList.add('active');
  document.getElementById('mode-1p').classList.remove('active');
  resetGame();
});

document.getElementById('p2-type-attack').addEventListener('click', () => {
  p2Type = 'attack';
  document.getElementById('p2-type-attack').classList.add('active');
  document.getElementById('p2-type-stamina').classList.remove('active');
});

document.getElementById('p2-type-stamina').addEventListener('click', () => {
  p2Type = 'stamina';
  document.getElementById('p2-type-stamina').classList.add('active');
  document.getElementById('p2-type-attack').classList.remove('active');
});

document.getElementById('launch-btn').addEventListener('click', () => {
  const power = parseInt(powerSlider.value) / 100;

  if (mode === 1) {
    if (launchedCount >= 1) return;
    p1.launch(power, Math.random() * 360);
    launchedCount = 1;
    gameActive = true;
    updateUI();
  } else {
    if (launchedCount >= 2) return;

    if (currentPlayer === 1) {
      p1.launch(power, 0 + Math.random() * 60 - 30);
    } else {
      p2.launch(power, 180 + Math.random() * 60 - 30);
    }

    launchedCount++;
    currentPlayer = currentPlayer === 1 ? 2 : 1;

    if (launchedCount >= 2) {
      gameActive = true;
    }
    updateUI();
  }
});

// 視窗調整
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 初始化
resetGame();
animate();
</script>
</body>
</html>
